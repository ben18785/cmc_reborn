# Manually triggered: gh workflow run experiments.yml [-f only=REGEX]
# One job per (example, method, seed) from config/config.yaml, each running the
# Snakefile for its fit; a final job merges the fits and runs `summarise`.
# The `results` artifact holds results/summary (tables, figures) and all fits.
name: experiments
on:
  workflow_dispatch:
    inputs:
      only:
        description: "optional regex on job names example-method-seedN"
        default: ""
      config:
        description: "config file"
        default: "config/config.yaml"
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: mk
        env:
          ONLY: ${{ inputs.only }}
          CFG: ${{ inputs.config }}
        run: |
          pip install pyyaml==6.0.4 >/dev/null
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, yaml
          c = yaml.safe_load(open(os.environ["CFG"]))
          only = os.environ.get("ONLY") or ""
          inc = []
          for e in c["examples"]:
              for m in c["methods"]:
                  for s in c["seeds"]:
                      name = f"{e}-{m}-seed{s}"
                      if not only or re.search(only, name):
                          inc.append(dict(name=name, example=e, method=m, seed=s))
          print("matrix=" + json.dumps({"include": inc}))
          PY
  fit:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-lock.txt && pip install -e .
      - name: fit
        run: |
          snakemake --cores 2 --configfile ${{ inputs.config }} --config config_file=${{ inputs.config }} \
            results/fits/${{ matrix.example }}/${{ matrix.method }}_seed${{ matrix.seed }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: fit-${{ matrix.name }}
          path: |
            results/fits/${{ matrix.example }}/${{ matrix.method }}_seed${{ matrix.seed }}.*
            results/data/${{ matrix.example }}_seed${{ matrix.seed }}.npz
  summarise:
    needs: fit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-lock.txt && pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: fit-*
          path: results
          merge-multiple: true
      - name: summarise
        run: |
          find results -type f | head -50
          snakemake --cores 1 --configfile ${{ inputs.config }} --config config_file=${{ inputs.config }} \
            --rerun-triggers mtime --keep-going summarise || \
          PYTHONPATH=. python workflow/scripts/summarise.py --fits results/fits --data results/data \
            --config ${{ inputs.config }} --out results/summary
          cat results/summary/table.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            results/summary
            results/fits
