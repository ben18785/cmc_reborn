# Manually triggered: gh workflow run experiments.yml [-f only=REGEX] [-f task=ppc]
# One job per (example, method, seed) from config/config.yaml, each running the
# Snakefile for its fit; a final job merges the fits and runs `summarise`.
# The `results` artifact holds results/summary (tables, figures) and all fits.
name: experiments
on:
  workflow_dispatch:
    inputs:
      only:
        description: "optional regex on job names example-method-seedN"
        default: ""
      config:
        description: "config file"
        default: "config/config.yaml"
      task:
        description: "fit (fits, then summarise) or ppc (posterior predictive checks of committed fits; `only` is a regex on examples)"
        default: "fit"
      seed:
        description: "ppc only: data set (seed) to check"
        default: "1"
jobs:
  plan:
    if: inputs.task == 'fit'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: mk
        env:
          ONLY: ${{ inputs.only }}
          CFG: ${{ inputs.config }}
        run: |
          pip install pyyaml==6.0.4 >/dev/null
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, yaml
          c = yaml.safe_load(open(os.environ["CFG"]))
          only = os.environ.get("ONLY") or ""
          inc = []
          for e in c["examples"]:
              for m in c["examples"][e].get("methods", c["methods"]):
                  for s in c["seeds"]:
                      name = f"{e}-{m}-seed{s}"
                      if not only or re.search(only, name):
                          inc.append(dict(name=name, example=e, method=m, seed=s))
          print("matrix=" + json.dumps({"include": inc}))
          PY
  fit:
    needs: plan
    if: inputs.task == 'fit'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5  # Python 3.11 for the Arruda et al. baseline (TensorFlow 2.15)
        if: startsWith(matrix.method, 'arruda')
        id: py311
        with:
          python-version: "3.11"
      - name: environment for the Arruda et al. baseline
        if: startsWith(matrix.method, 'arruda')
        run: |
          ${{ steps.py311.outputs.python-path }} -m venv .venv-arruda
          .venv-arruda/bin/pip install -q -r requirements-arruda.txt
          .venv-arruda/bin/pip freeze > arruda-freeze.txt
          echo "ARRUDA_PY=$PWD/.venv-arruda/bin/python" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-lock.txt && pip install -e .
      - name: CPU PyTorch for the Sourcerer baseline
        if: startsWith(matrix.method, 'sourcerer') || startsWith(matrix.method, 'neb')
        run: pip install -r requirements-sourcerer.txt
      - name: BayesFlow 2 (torch backend) for the ML-NPE baseline
        if: startsWith(matrix.method, 'mlnpe')
        run: |
          pip install -r requirements-mlnpe.txt
          pip freeze > mlnpe-freeze.txt
          echo "KERAS_BACKEND=torch" >> "$GITHUB_ENV"
      - uses: mamba-org/setup-micromamba@v2  # Rust toolchain for the Pmetrics/PMcore baseline
        if: startsWith(matrix.method, 'pmetrics')
        with:
          environment-file: workflow/envs/pmcore.yaml
          cache-environment: true
      - name: cargo of the pmcore environment
        if: startsWith(matrix.method, 'pmetrics')
        run: |
          echo "PMCORE_CARGO=$MAMBA_ROOT_PREFIX/envs/pmcore/bin/cargo" >> "$GITHUB_ENV"
          micromamba list -n pmcore > pmcore-freeze.txt
      - uses: mamba-org/setup-micromamba@v2  # R + nlmixr2 for the NLME software baseline
        if: startsWith(matrix.method, 'nlme')
        with:
          environment-file: workflow/envs/nlmixr2.yaml
          cache-environment: true
      - name: Rscript of the nlmixr2 environment
        if: startsWith(matrix.method, 'nlme')
        run: |
          echo "NLMIXR_RSCRIPT=$MAMBA_ROOT_PREFIX/envs/nlmixr2/bin/Rscript" >> "$GITHUB_ENV"
          micromamba list -n nlmixr2 > nlmixr2-freeze.txt
      - uses: julia-actions/setup-julia@v2  # Julia 1.5.2 for the PEPSDI baseline (the authors' version)
        if: startsWith(matrix.method, 'pepsdi')
        with:
          version: "1.5.2"
      - name: environment for the PEPSDI baseline
        if: startsWith(matrix.method, 'pepsdi')
        run: |
          # General registry as of 2021-02-28: packages resolve as in the authors' environment (fit_pepsdi.jl)
          REG=~/.julia/registries/General
          mkdir -p $REG
          git -C $REG init -q
          git -C $REG remote add origin https://github.com/JuliaRegistries/General.git
          git -C $REG fetch -q --depth 1 origin 09e06dd261b24e047c2fb59afda566d16c4e8725
          git -C $REG checkout -q FETCH_HEAD
          julia --project=workflow/envs/pepsdi -e 'using Pkg; isfile(joinpath(dirname(Base.active_project()), "Manifest.toml")) || Pkg.resolve(); Pkg.instantiate(); Pkg.precompile(); Pkg.status(mode=Pkg.PKGMODE_MANIFEST)'
          cp workflow/envs/pepsdi/Manifest.toml pepsdi-Manifest.toml
      - name: results directory (a config may set `results:`)
        run: echo "RES=$(python -c "import yaml; print(yaml.safe_load(open('${{ inputs.config }}')).get('results', 'results'))")" >> "$GITHUB_ENV"
      - name: fit
        run: |
          snakemake $RES/fits/${{ matrix.example }}/${{ matrix.method }}_seed${{ matrix.seed }}.json \
            --cores 2 --configfile ${{ inputs.config }} --config config_file=${{ inputs.config }} results=$RES \
            arruda_python=${ARRUDA_PY:-python} nlmixr_rscript=${NLMIXR_RSCRIPT:-Rscript} pmcore_cargo=${PMCORE_CARGO:-cargo}
      - uses: actions/upload-artifact@v4
        with:
          name: fit-${{ matrix.name }}
          path: |
            ${{ env.RES }}/fits/${{ matrix.example }}/${{ matrix.method }}_seed${{ matrix.seed }}.*
            ${{ env.RES }}/data/${{ matrix.example }}_seed${{ matrix.seed }}.npz
            ${{ env.RES }}/external/*/${{ matrix.example }}/${{ matrix.method }}_seed${{ matrix.seed }}.*
            arruda-freeze.txt
            nlmixr2-freeze.txt
            mlnpe-freeze.txt
            pmcore-freeze.txt
            workflow/scripts/pmcore_tf/Cargo.lock
            pepsdi-Manifest.toml
  summarise:
    needs: fit
    if: always() && inputs.task == 'fit'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-lock.txt && pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: fit-*
          path: artifacts
      - name: summarise
        run: |
          # each data file is uploaded by several jobs: merge without clobbering
          mkdir -p results
          for d in artifacts/*/; do cp -Rn "$d"* results/; done
          # fits come from the artifacts: only the summarise rule may run (a missing fit is an error, not a rerun)
          snakemake summarise --cores 1 --configfile ${{ inputs.config }} --config config_file=${{ inputs.config }} \
            --rerun-triggers mtime --allowed-rules summarise --forcerun summarise
          cat results/summary/table.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            results/summary
            results/fits
  ppc_plan:
    if: inputs.task == 'ppc'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      res: ${{ steps.mk.outputs.res }}
    steps:
      - uses: actions/checkout@v4
      - id: mk
        env:
          ONLY: ${{ inputs.only }}
          CFG: ${{ inputs.config }}
          SEED: ${{ inputs.seed }}
        run: |
          pip install pyyaml==6.0.4 >/dev/null
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, yaml
          c = yaml.safe_load(open(os.environ["CFG"]))
          res = c.get("results", "results")
          only, seed = os.environ.get("ONLY") or "", os.environ["SEED"]
          inc = [dict(example=e) for e in c["examples"] if c["examples"][e].get("methods")
                 and os.path.exists(f"{res}/data/{e}_seed{seed}.npz") and (not only or re.search(only, e))]
          print("matrix=" + json.dumps({"include": inc}))
          print("res=" + res)
          PY
  ppc_simulate:
    needs: ppc_plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.ppc_plan.outputs.matrix) }}
    name: ppc-${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-lock.txt && pip install -e .
      - run: |
          RES=${{ needs.ppc_plan.outputs.res }}
          snakemake $RES/ppc/${{ matrix.example }}_seed${{ inputs.seed }}.npz --cores 2 \
            --configfile ${{ inputs.config }} --config config_file=${{ inputs.config }} results=$RES \
            --allowed-rules ppc --forcerun ppc
      - uses: actions/upload-artifact@v4
        with:
          name: ppc-${{ matrix.example }}
          path: ${{ needs.ppc_plan.outputs.res }}/ppc/${{ matrix.example }}_seed${{ inputs.seed }}.npz
  ppc_plot:
    needs: [ppc_plan, ppc_simulate]
    if: always() && inputs.task == 'ppc'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-lock.txt && pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: ppc-*
          path: ${{ needs.ppc_plan.outputs.res }}/ppc
          merge-multiple: true
      - run: |
          RES=${{ needs.ppc_plan.outputs.res }}
          PYTHONPATH=.:workflow/scripts python workflow/scripts/plot_ppc.py --ppc $RES/ppc \
            --config ${{ inputs.config }} --out $RES/summary/ppc
      - uses: actions/upload-artifact@v4
        with:
          name: ppc
          path: |
            ${{ needs.ppc_plan.outputs.res }}/ppc
            ${{ needs.ppc_plan.outputs.res }}/summary/ppc
