# Manually triggered: gh workflow run ppc.yml -f config=config/v3.yaml [-f only=REGEX]
# Posterior predictive checks from fits already committed under the config's results directory:
# one job per example simulates every method's fitted population (rule ppc); a final job draws the
# figures (rule ppc_plots). The `ppc` artifact holds <results>/ppc and <results>/summary/ppc.
name: ppc
on:
  workflow_dispatch:
    inputs:
      config:
        description: "config file"
        default: "config/v3.yaml"
      only:
        description: "optional regex on example names"
        default: ""
      seed:
        description: "data set (seed) to check"
        default: "1"
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.mk.outputs.matrix }}
      res: ${{ steps.mk.outputs.res }}
    steps:
      - uses: actions/checkout@v4
      - id: mk
        env:
          ONLY: ${{ inputs.only }}
          CFG: ${{ inputs.config }}
          SEED: ${{ inputs.seed }}
        run: |
          pip install pyyaml==6.0.4 >/dev/null
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, re, yaml
          c = yaml.safe_load(open(os.environ["CFG"]))
          res = c.get("results", "results")
          only, seed = os.environ.get("ONLY") or "", os.environ["SEED"]
          inc = [dict(example=e) for e in c["examples"] if c["examples"][e].get("methods")
                 and os.path.exists(f"{res}/data/{e}_seed{seed}.npz") and (not only or re.search(only, e))]
          print("matrix=" + json.dumps({"include": inc}))
          print("res=" + res)
          PY
  simulate:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: ppc-${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-lock.txt && pip install -e .
      - run: |
          RES=${{ needs.plan.outputs.res }}
          snakemake $RES/ppc/${{ matrix.example }}_seed${{ inputs.seed }}.npz --cores 2 \
            --configfile ${{ inputs.config }} --config config_file=${{ inputs.config }} results=$RES \
            --allowed-rules ppc --forcerun ppc
      - uses: actions/upload-artifact@v4
        with:
          name: ppc-${{ matrix.example }}
          path: ${{ needs.plan.outputs.res }}/ppc/${{ matrix.example }}_seed${{ inputs.seed }}.npz
  plot:
    needs: [plan, simulate]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-lock.txt && pip install -e .
      - uses: actions/download-artifact@v4
        with:
          pattern: ppc-*
          path: ${{ needs.plan.outputs.res }}/ppc
          merge-multiple: true
      - run: |
          RES=${{ needs.plan.outputs.res }}
          PYTHONPATH=.:workflow/scripts python workflow/scripts/plot_ppc.py --ppc $RES/ppc \
            --config ${{ inputs.config }} --out $RES/summary/ppc
      - uses: actions/upload-artifact@v4
        with:
          name: ppc
          path: |
            ${{ needs.plan.outputs.res }}/ppc
            ${{ needs.plan.outputs.res }}/summary/ppc
