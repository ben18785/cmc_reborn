# Environment for the ML-NPE baseline (rule `mlnpe`): the cmc environment plus BayesFlow 2.1.0,
# Keras 3 and CPU PyTorch. Keep in sync with requirements-mlnpe.txt (GitHub Actions).
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - -r ../../requirements-lock.txt
      - -r ../../requirements-mlnpe.txt
