# Pinned Rust toolchain for the nonparametric (NPAG) baseline: builds workflow/scripts/pmcore_tf against
# PMcore, the Rust engine of Pmetrics (rule `pmcore_build`). Crates are pinned in its Cargo.toml.
# Linking uses the system C compiler (`cc`), present on the Ubuntu runners.
name: pmcore
channels:
  - conda-forge
dependencies:
  - rust=1.99.1
