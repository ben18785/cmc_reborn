# Smoke-test configuration: tiny sizes, checks that the pipeline runs end to end.

seeds: [1]

examples:
  scalar:
    model: {}
    n_cells: 300          # cells per snapshot
    holdout: []            # block indices not used for fitting (predictive check)
    n_sweeps: 2
    methods: [cmc_paper, cmc_augmented, iter_kde, iter_logistic, iter_mlp]
  linear:                  # 24 snapshots x 2 markers, 5 parameters, identified population
    model: {p: 5, n_blocks: 24, d: 2, sigma: 0.5}
    n_cells: 300
    holdout: [5, 11, 17, 23]
    n_sweeps: 2
    methods: [cmc_paper, cmc_augmented, iter_kde, iter_logistic, iter_mlp]
  growth:                  # 2 doses x 6 times x (log R, log P), log-normal measurement noise
    model: {noise_sd: 0.1}
    n_cells: 300
    holdout: [3, 9]        # t = 20 at both doses
    n_sweeps: 2
    methods: [cmc_paper, cmc_augmented, iter_kde, iter_logistic, iter_mlp]
  gene:                    # 8 times x 3 genes, Poisson intrinsic noise + 30% capture
    model: {capture: 0.3}
    n_cells: 300
    holdout: [3, 6]        # t = 3 h and t = 8 h
    n_sweeps: 2
    methods: [cmc_paper, cmc_augmented, iter_kde, iter_logistic, iter_mlp]
  growth_tracked:
    kind: growth
    model: {noise_sd: 0.1, design: tracked}
    n_cells: 200
    holdout: []
    n_sweeps: 2
    methods: [iter_logistic, bb_logistic, bayes_gauss, bayes_dpm_nre]
  linear_bayes:
    kind: linear
    model: {p: 5, n_blocks: 24, d: 2, sigma: 0.5}
    n_cells: 200
    holdout: []
    n_sweeps: 2
    methods: [iter_logistic, bb_logistic, bayes_gauss, bayes_dpm, bayes_dpm_nre]
  gene_truth:
    kind: gene
    experiment: robustness
    model: {capture: 0.3}
    n_cells: 200
    holdout: []
    n_sweeps: 2
    methods: [iter_logistic_truth, bayes_gauss_truth, bayes_gauss_nre_truth, bayes_gauss_nre_small_truth]
  gene_n100:
    kind: gene
    experiment: robustness
    model: {capture: 0.3}
    n_cells: 100
    holdout: []
    n_sweeps: 2
    methods: [iter_logistic, bb_logistic, bayes_gauss, bayes_gauss_nre]
  gene_n300:
    kind: gene
    experiment: robustness
    model: {capture: 0.3}
    n_cells: 300
    holdout: []
    n_sweeps: 2
    methods: [iter_logistic, bb_logistic, bayes_gauss_nre]

  bd_ssa:
    kind: bd_ssa
    experiment: ssa
    model: {design: snapshot}
    n_cells: 150
    holdout: []
    n_sweeps: 2
    methods: [iter_logistic, bb_logistic_ssa, bayes_gauss, bayes_gauss_nre]
  feedback_ssa_tracked:
    kind: feedback_ssa
    experiment: ssa
    model: {design: tracked}
    n_cells: 150
    holdout: []
    n_sweeps: 2
    settings: {n_particles: 800, n_reps: 2}
    methods: [iter_logistic, bb_logistic_ssa, bayes_gauss_nre]
  fish_sim:
    kind: fish
    experiment: fish
    model: {}
    n_cells: 60
    holdout: []
    n_sweeps: 2
    methods: [iter_bins, bb_bins, bayes_dpm]
  fish_real:
    kind: fish
    experiment: fish
    data_csv: data/fish/functional_response.csv
    model: {}
    n_cells: 60
    holdout: []
    n_sweeps: 2
    methods: [iter_bins, bayes_gauss]
  tf_egfp:
    kind: transfection
    experiment: transfection
    data_tracks: data/transfection/eGFP.csv
    model: {}
    n_cells: 100
    holdout: []
    n_sweeps: 2
    methods: [iter_logistic, bb_logistic, bayes_gauss]
  tf_ssa_sim:
    kind: transfection_ssa
    experiment: transfection
    model: {}
    n_cells: 100
    holdout: []
    n_sweeps: 2
    settings: {n_particles: 600, n_reps: 2}
    methods: [iter_logistic, bayes_gauss_nre]
methods:
  cmc_paper:               # original CMC: deterministic map, joint vine-KDE pushforward, one step
    kind: one_step
    noise: false
  cmc_augmented:           # stochastic map via augmentation (Butler et al. 2020), one step
    kind: one_step
    noise: true
  iter_kde:                # iterated, block-wise, KDE ratios
    kind: iterate
    ratio: kde
  iter_logistic:           # iterated, block-wise, logistic regression on quadratic features
    kind: iterate
    ratio: logistic2
  iter_mlp:                # iterated, block-wise, neural-network classifier
    kind: iterate
    ratio: mlp
  bb_logistic:
    kind: bootstrap
    ratio: logistic2
    n_boot: 3
  bayes_gauss:
    kind: bayes
    lik: exact
    n_comp: 1
  bayes_dpm:
    kind: bayes
    lik: exact
    n_comp: 3
  bayes_dpm_nre:
    kind: bayes
    lik: nre
    n_comp: 3

  bb_logistic_ssa:         # Bayesian bootstrap for the costlier Gillespie examples
    kind: bootstrap
    ratio: logistic2
    n_boot: 2
  iter_bins:               # iterated, logistic regression on one indicator per count (whole pmf of a 1-d count block)
    kind: iterate
    ratio: logistic_bins
  bb_bins:                 # Bayesian bootstrap of iter_bins
    kind: bootstrap
    ratio: logistic_bins
    n_boot: 2
  bayes_gauss_nre:
    kind: bayes
    lik: nre
    n_comp: 1
  iter_logistic_truth:
    kind: iterate
    ratio: logistic2
    init: truth
  bayes_gauss_truth:
    kind: bayes
    lik: exact
    n_comp: 1
    init: truth
    n_checks: 5
  bayes_gauss_nre_truth:
    kind: bayes
    lik: nre
    n_comp: 1
    init: truth
    n_checks: 5
  bayes_gauss_nre_small_truth:
    kind: bayes
    lik: nre
    n_comp: 1
    init: truth
    n_checks: 5
    bayes: {nre_train: 500, nre_hidden: [8, 8], nre_rounds: 1}

bayes:
  n_burn: 60
  n_keep: 40
  thin: 10
  n_pop: 200
  sigma_scale: 0.25
  nu_extra: 3.0
  n_init: 50
  nre_train: 2000
  nre_rounds: 2
  nre_hidden: [16, 16]

settings:                  # cmc.Settings defaults for every fit
  n_particles: 1500
  n_reps: 4
  n_fit: 500
  ess_frac: 0.5
  shrink: 0.95
  clip: 8.0
  step: 1.0
  threads: 2
  one_step_particles: 2000
  n_truth: 1000           # population draws used to score parameter recovery
  n_pop: 200
