  tf_sim:
    kind: transfection
    experiment: transfection
    model: {}
    n_cells: 2565
    holdout: []
    n_sweeps: 150
    methods: [iter_mlp, bb_mlp, bayes_gauss, bayes_gauss_nre_big1, arruda, sourcerer, nlme_saem, nlme_focei, neb, npmle, npmle_bb, pmetrics_npag, mlnpe, mlnpe_sub, pmetrics_smoke, mlnpe_smoke]
  tf_egfp:
    kind: transfection
    experiment: transfection
    data_tracks: data/transfection/eGFP.csv
    model: {}
    n_cells: 2565
    holdout: []
    n_sweeps: 150
    methods: [iter_mlp, bb_mlp, bayes_gauss, bayes_gauss_nre_big1, arruda, sourcerer, nlme_saem, nlme_focei, neb, npmle, npmle_bb, pmetrics_npag, mlnpe, mlnpe_sub]
  tf_d2egfp:
    kind: transfection
    experiment: transfection
    data_tracks: data/transfection/d2eGFP.csv
    model: {}
    n_cells: 2923
    holdout: []
    n_sweeps: 150
    methods: [iter_mlp, bb_mlp, bayes_gauss, bayes_gauss_nre_big1, arruda, sourcerer, nlme_saem, nlme_focei, neb, npmle, npmle_bb, pmetrics_npag, mlnpe, mlnpe_sub]
  tf_ssa_sim:
    kind: transfection_ssa
    experiment: transfection
    model: {}
    n_cells: 2565
    holdout: []
    n_sweeps: 100
    settings: *id002
    methods: [iter_mlp, bayes_gauss_nre_big1, arruda, sourcerer, neb, mlnpe_ssa, pepsdi, pepsdi_smoke]
  tf_ssa_egfp:
    kind: transfection_ssa
    experiment: transfection
    data_tracks: data/transfection/eGFP.csv
    model: {}
    n_cells: 2565
    holdout: []
    n_sweeps: 100
    settings: *id002
    methods: [iter_mlp, bayes_gauss_nre_big1, arruda, sourcerer, neb, mlnpe_ssa, pepsdi]
methods:
  sourcerer:               # Vetter et al. (2024): their code and default settings (workflow/scripts/fit_sourcerer.py)
    kind: external
    tool: sourcerer
    n_train: 200000        # surrogate training simulations (as the likelihood-free Bayes runs, 200k per block)
  neb:                     # Vandegar et al. (2021): NEB marginal likelihood, Sourcerer's surrogate and source model (workflow/scripts/fit_neb.py)
    kind: external
    tool: neb
    n_train: 200000        # surrogate training simulations, as sourcerer
    minutes: 210           # total wall-clock budget (surrogate + source)
  pmetrics_npag:           # NPAG (Neely et al. 2012; Yamada et al. 2021) in PMcore, the Rust engine of Pmetrics (workflow/scripts/fit_pmetrics.py)
    kind: external
    tool: pmetrics
    algorithm: npag
    points: 2028           # PMcore default Sobol start
    minutes: 240           # wall-clock budget for the cycles (CI limit 350 min)
  pmetrics_smoke:          # compile/data check only (not reported)
    kind: external
    tool: pmetrics
    algorithm: npag
    points: 2028
    minutes: 10
    max_cells: 200
  mlnpe:                   # Habermann et al. (2025): ML-NPE, BayesFlow 2.1.0 (workflow/scripts/fit_mlnpe.py)
    kind: external
    tool: mlnpe
    train_minutes: 240     # ODE examples (online training)
    sim_minutes: 80        # Gillespie bank only
    batch_size: 32
    max_batch_cells: 65536
    n_local: 64
    n_keep: 50
  mlnpe_sub:               # the same, with training data sets of log-uniform size on [128, J_obs] (most steps cheap; full size still seen) and all 4 runner cores
    kind: external
    tool: mlnpe
    train_minutes: 240
    sim_minutes: 80
    batch_size: 32
    max_batch_cells: 65536
    n_local: 64
    n_keep: 50
    j_min: 128
    threads: 4
  mlnpe_ssa:               # the same for the Gillespie examples: 80 min simulation bank + 160 min training
    kind: external
    tool: mlnpe
    train_minutes: 160
    sim_minutes: 80
    batch_size: 32
    max_batch_cells: 65536
    n_local: 64
    n_keep: 50
  mlnpe_smoke:             # API check only (not reported)
    kind: external
    tool: mlnpe
    train_minutes: 3
    sim_minutes: 2
    batch_size: 4
    max_batch_cells: 8192
    n_local: 16
    n_keep: 5
  pepsdi:                  # Persson et al. (2022): their code (PEPSDI, Julia), option 2, Extrande filter (workflow/scripts/fit_pepsdi.jl)
    kind: external
    tool: pepsdi
    n_cells: 100           # random subset of cells: particle-MCMC cost is linear in cells
    n_particles_pilot: 200
    n_pilot_max: 5000
    n_main_max: 50000
    minutes: 300           # budget of the Julia run (timing, pilot, tuning, main) within the 350-min job
    n_times_run_filter: 20 # filter runs per particle count when tuning (theirs 100); at 50, tuning took 4-5 h
    n_main_min: 100        # the main run shrinks to the time left after tuning, never past `minutes`
    n_keep: 50
  pepsdi_smoke:            # environment/API check only (not reported)
    kind: external
    tool: pepsdi
    n_cells: 10
    n_particles_pilot: 50
    n_pilot_min: 20
    n_pilot_max: 50
    n_main_min: 50
    n_main_max: 100
    minutes: 15
    n_keep: 5
  npmle:                   # exact-likelihood NPMLE of the population on an adaptive grid (workflow/scripts/fit_npmle.py): the oracle for CMC's fixed point
    kind: external
    tool: npmle
    n_grid: 4000
    n_new: 3000
    n_rounds: 8
    minutes: 240           # refinement stops after this (recorded)
  npmle_bb:                # the same, with a Bayesian bootstrap of the weights on the final grid
    kind: external
    tool: npmle
    n_grid: 4000
    n_new: 3000
    n_rounds: 8
    minutes: 200
    n_boot: 20
    boot_minutes: 60
  nlme_saem:               # nlmixr2 (SAEM), the transfection ODE as a practitioner would fit it
    kind: external
    tool: nlmixr2
    est: saem
  nlme_focei:
    kind: external
    tool: nlmixr2
    est: focei
  arruda:                  # Arruda et al. (2024): their code and pretrained network (workflow/scripts/fit_arruda.py)
    kind: external
    tool: arruda
    n_multi_starts: 10
    n_samples_opt: 100
    n_mcmc: 10000
    mcmc_minutes: 120
    n_keep: 50
    workers: 1
  iter_logistic: {kind: iterate, ratio: logistic2}
  iter_mlp: {kind: iterate, ratio: mlp}
  iter_bins: {kind: iterate, ratio: logistic_bins}
  bayes_gauss: {kind: bayes, lik: exact, n_comp: 1}
  bayes_dpm: {kind: bayes, lik: exact, n_comp: 10, alpha: 1.0}
  bb_mlp: {kind: bootstrap, ratio: mlp, n_boot: 20}
  bb_mlp_ssa: {kind: bootstrap, ratio: mlp, n_boot: 8}
  bb_bins: {kind: bootstrap, ratio: logistic_bins, n_boot: 20}
  bayes_gauss_nre_big:
    kind: bayes
    lik: nre
    n_comp: 1
    bayes: {nre_train: 200000}
  bayes_dpm_nre_big:
    kind: bayes
    lik: nre
    n_comp: 10
    alpha: 1.0
    bayes: {nre_train: 200000}
  bayes_gauss_nre_big1:
    kind: bayes
    lik: nre
    n_comp: 1
    bayes: {nre_train: 1000000}
  bayes_dpm_nre_big1:
    kind: bayes
    lik: nre
    n_comp: 10
    alpha: 1.0
    bayes: {nre_train: 1000000}
bayes:
  n_burn: 3000
  n_keep: 2000
  thin: 10
  n_pop: 1000
  sigma_scale: 0.25
  nu_extra: 3.0
  n_init: 500
  nre_train: 40000
  nre_rounds: 3
  nre_hidden: [128, 128]
settings: {n_particles: 80000, n_reps: 4, n_fit: 32000, ess_frac: 0.5, shrink: 0.95, clip: 8.0, step: 2.0, threads: 2,
  one_step_particles: 50000, n_truth: 20000, n_pop: 1000, rejuv: always, boot_workers: 4}
