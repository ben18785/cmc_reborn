# Comparable rerun (v2). Same data as config.yaml (same seeds), results in results_v2/.
# CMC uses the converged settings from the robustness tests (80k particles, 32k training sims,
# over-relaxed EM with step 2, resample-move after every update); its bootstrap uses the same settings
# and classifier. Likelihood-free Bayes gets a larger simulation budget (200k per block per round, or
# 1M for one- or two-block examples), capped by network training time. Exact Bayes is unchanged.
results: results_v2
seeds: [1, 2, 3]
examples:
  scalar:
    model: {}
    n_cells: 4000
    holdout: []
    n_sweeps: 40
    methods: [iter_logistic, iter_mlp]
  linear:
    model: {p: 5, n_blocks: 24, d: 2, sigma: 0.5}
    n_cells: 2000
    holdout: [5, 11, 17, 23]
    n_sweeps: 40
    methods: [iter_logistic, iter_mlp]
  growth:
    model: {noise_sd: 0.1}
    n_cells: 2000
    holdout: [3, 9]
    n_sweeps: 40
    methods: [iter_logistic, iter_mlp]
  gene:
    model: {capture: 0.3}
    n_cells: 2000
    holdout: [3, 6]
    n_sweeps: 40
    methods: [iter_logistic, iter_mlp]
  linear_bayes:
    kind: linear
    model: {p: 5, n_blocks: 24, d: 2, sigma: 0.5}
    n_cells: 2000
    holdout: []
    n_sweeps: 40
    methods: [iter_mlp, bb_mlp, bayes_gauss, bayes_dpm, bayes_dpm_nre_big, sourcerer, neb, npmle, npmle_bb]
  growth_snapshot:
    kind: growth
    model: {noise_sd: 0.1, design: snapshot}
    n_cells: 2000
    holdout: []
    n_sweeps: 40
    methods: [iter_mlp, bb_mlp, bayes_gauss, bayes_dpm, bayes_dpm_nre_big, sourcerer, neb, npmle, npmle_bb]
  growth_tracked:
    kind: growth
    model: {noise_sd: 0.1, design: tracked}
    n_cells: 2000
    holdout: []
    n_sweeps: 120
    methods: [iter_mlp, bb_mlp, bayes_gauss, bayes_dpm, bayes_dpm_nre_big1, sourcerer, neb, npmle, npmle_bb]
  gene_n2000:
    kind: gene
    experiment: robustness
    model: {capture: 0.3}
    n_cells: 2000
    holdout: []
    n_sweeps: 40
    methods: [iter_mlp, bb_mlp, bayes_gauss, bayes_gauss_nre_big, sourcerer, neb, npmle, npmle_bb]
  gene_n8000:
    kind: gene
    experiment: robustness
    model: {capture: 0.3}
    n_cells: 8000
    holdout: []
    n_sweeps: 40
    methods: [iter_mlp, bb_mlp, bayes_gauss, bayes_gauss_nre_big, sourcerer, neb, npmle, npmle_bb]
  gene_n32000:
    kind: gene
    experiment: robustness
    model: {capture: 0.3}
    n_cells: 32000
    holdout: []
    n_sweeps: 40
    methods: [iter_mlp, bb_mlp, bayes_gauss, bayes_gauss_nre_big, sourcerer, neb, npmle, npmle_bb]
  bd_ssa:
    kind: bd_ssa
    experiment: ssa
    model: {design: snapshot}
    n_cells: 2000
    holdout: []
    n_sweeps: 40
    settings: &id001 {n_particles: 40000, n_fit: 16000, n_reps: 2}
    methods: [iter_mlp, bb_mlp_ssa, bayes_gauss, bayes_gauss_nre_big, sourcerer, neb, npmle, npmle_bb]
  feedback_ssa:
    kind: feedback_ssa
    experiment: ssa
    model: {design: snapshot}
    n_cells: 2000
    holdout: []
    n_sweeps: 40
    settings: *id001
    methods: [iter_mlp, bb_mlp_ssa, bayes_gauss_nre_big, sourcerer, neb]
  bd_ssa_tracked:
    kind: bd_ssa
    experiment: ssa
    model: {design: tracked}
    n_cells: 2000
    holdout: []
    n_sweeps: 160
    settings: &id002 {n_particles: 20000, n_fit: 16000, n_reps: 2}
    methods: [iter_mlp, bayes_gauss, bayes_gauss_nre_big1, sourcerer, neb, npmle, npmle_bb, mlnpe_ssa, mlnpe_smoke]
  feedback_ssa_tracked:
    kind: feedback_ssa
    experiment: ssa
    model: {design: tracked}
    n_cells: 2000
    holdout: []
    n_sweeps: 120
    settings: *id002
    methods: [iter_mlp, bayes_gauss_nre_big1, sourcerer, neb]
  fish_sim:
    kind: fish
    experiment: fish
    model: {}
    n_cells: 95
    holdout: []
    n_sweeps: 40
    methods: [iter_bins, bb_bins, bayes_gauss, bayes_dpm, sourcerer, neb, npmle, npmle_bb]
  fish_real:
    kind: fish
    experiment: fish
    data_csv: data/fish/functional_response.csv
    model: {}
    n_cells: 95
    holdout: []
